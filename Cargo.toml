[package]
name = "vac-vod"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
# dotenvy = "0.15.7"
futures = "0.3.33"
html-escape = "0.2.15"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
# tracing = "0.1.44"
# tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"

[profile.release]
codegen-units = 1
lto = true

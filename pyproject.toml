[project]
name = "embedding"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "plsuwu", email = "124419933+plsuwu@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jsonlines>=4.0.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[project.scripts]
embedding = "embedding:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 70
